<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify your email · WorshipSync</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
      </div>
      <p class="auth-brand-name">WorshipSync</p>
    </div>

    <div class="verify-illustration">
      <i data-lucide="mail-check"></i>
    </div>

    <h1 class="auth-title">Check your email</h1>
    <p class="auth-sub">
      We sent a verification link to <br />
      <span class="verify-email-display" id="emailDisplay">your email</span>
    </p>

    <div class="verify-steps">
      <div class="verify-step">
        <div class="verify-step-num">1</div>
        <div><strong>Open the email</strong> from WorshipSync. Check your spam folder if you don't see it.</div>
      </div>
      <div class="verify-step">
        <div class="verify-step-num">2</div>
        <div><strong>Click the verification link</strong> inside the email.</div>
      </div>
      <div class="verify-step">
        <div class="verify-step-num">3</div>
        <div><strong>Come back here and click "I verified"</strong> to continue.</div>
      </div>
    </div>

    <div id="verifyError" class="auth-error" hidden>
      <i data-lucide="alert-circle"></i>
      <span id="verifyErrorText"></span>
    </div>

    <div class="verify-actions">
      <button class="auth-submit" id="checkBtn">
        <span id="checkText">I verified — continue</span>
        <i data-lucide="check" id="checkIcon"></i>
      </button>
      <button class="btn-link" id="resendBtn">Didn't get the email? Resend</button>
      <button class="btn-link" id="logoutBtn">Sign out and use a different email</button>
    </div>
  </div>

  <script type="module">
    import { initFirebase, resendVerificationEmail, logOut, getAuthUser, onAuthReady } from './js/shared/auth.js';
    import { isFirebaseConfigured } from './js/shared/firebase-config.js';

    if (window.lucide) window.lucide.createIcons();

    if (!isFirebaseConfigured()) {
      location.href = 'login.html';
    }

    // Show the email address the verification was sent to
    function setEmailDisplay() {
      let email = null;
      try {
        const pending = JSON.parse(sessionStorage.getItem('worshipsync.pendingSignup') || 'null');
        if (pending) email = pending.email;
      } catch (_) {}
      const user = getAuthUser();
      if (user?.email) email = user.email;
      if (email) document.getElementById('emailDisplay').textContent = email;
    }

    // Need to wait for auth ready to fetch the user
    onAuthReady((user) => {
      if (!user) {
        // Not signed in at all
        location.href = 'login.html';
        return;
      }
      if (user.emailVerified) {
        // Already verified
        location.href = 'index.html';
        return;
      }
      setEmailDisplay();
    });

    const checkBtn = document.getElementById('checkBtn');
    const checkText = document.getElementById('checkText');
    const errorBox = document.getElementById('verifyError');
    const errorText = document.getElementById('verifyErrorText');

    function showError(msg) {
      errorText.textContent = msg;
      errorBox.hidden = false;
    }
    function clearError() { errorBox.hidden = true; }

    // Check verification — reload the user and look at emailVerified flag
    checkBtn.addEventListener('click', async () => {
      clearError();
      checkBtn.disabled = true;
      checkText.textContent = 'Checking…';
      try {
        const user = getAuthUser();
        if (!user) throw new Error('Not signed in');
        await user.reload();
        if (user.emailVerified) {
          try { sessionStorage.removeItem('worshipsync.pendingSignup'); } catch (_) {}
          location.href = 'index.html';
        } else {
          showError('Email not verified yet. Click the link in the email first, then try again.');
          checkBtn.disabled = false;
          checkText.textContent = 'I verified — continue';
        }
      } catch (err) {
        showError(err.message || 'Something went wrong.');
        checkBtn.disabled = false;
        checkText.textContent = 'I verified — continue';
      }
    });

    // Resend
    const resendBtn = document.getElementById('resendBtn');
    let resendCooldown = 0;
    resendBtn.addEventListener('click', async () => {
      if (resendCooldown > 0) return;
      clearError();
      try {
        await resendVerificationEmail();
        resendBtn.textContent = 'Sent! Check your inbox.';
        resendCooldown = 30;
        const timer = setInterval(() => {
          resendCooldown--;
          if (resendCooldown <= 0) {
            clearInterval(timer);
            resendBtn.textContent = "Didn't get the email? Resend";
          } else {
            resendBtn.textContent = `Resend available in ${resendCooldown}s`;
          }
        }, 1000);
      } catch (err) {
        showError(err.message || 'Could not resend verification email.');
      }
    });

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', () => {
      logOut();
    });

    initFirebase().catch(() => {});
  </script>
</body>
</html>
